# Ghostty config. All options: `ghostty +show-config --default --docs`
# or https://ghostty.org/docs/config/reference

theme = Dracula

font-family = Hack
font-size = 12

# Every new window opens full screen.
fullscreen = true

# No bell sound, window alert or title marker.
bell-features = no-system,no-audio,no-attention,no-title,no-border

# Programs (tmux, nvim over OSC 52) may write the clipboard but not read it.
clipboard-write = allow
clipboard-read = deny
